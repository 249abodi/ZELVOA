services:
  postgres:
    image: postgres:16-alpine
    container_name: zelvoa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zelvoa
      POSTGRES_PASSWORD: zelvoa
      POSTGRES_DB: zelvoa
    ports:
      - "5432:5432"
    volumes:
      - zelvoa-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zelvoa"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  zelvoa-pgdata: